name: RunTests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'adopt'
      - name: Test with Gradle
        run: ./gradlew test
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports  # Artifact name
          path: backend/build/reports/tests/test  # Path to the test report directory
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'adopt'
      - name: Build with Gradle
        run: ./gradlew build
